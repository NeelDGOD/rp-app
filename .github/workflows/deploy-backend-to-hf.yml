name: Deploy backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Push backend/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi().upload_folder(
              repo_id="Ne-el/rp-bot",
              repo_type="space",
              folder_path="backend",
              path_in_repo=".",
              token=os.environ["HF_TOKEN"],
              commit_message="Sync backend from GitHub",
              ignore_patterns=["__pycache__/**", "*.pyc", ".env"],
          )
          PY
